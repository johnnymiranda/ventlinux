[package]
name = "ventlinux"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native Linux Ventrilo 3 client"

[[bin]]
name = "ventlinux"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
directories = { workspace = true }
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
glib = "0.20"
vent-core = { path = "../vent-core" }
vent-audio = { path = "../vent-audio" }
vent-ptt = { path = "../vent-ptt" }
