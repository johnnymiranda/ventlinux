[package]
name = "vent-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PipeWire/cpal capture and mixed playback for VentLinux"

[dependencies]
cpal = { workspace = true }
anyhow = { workspace = true }
vent-core = { path = "../vent-core" }
# Only for snd_lib_error_set_handler, to stop libasound writing enumeration
# failures to stderr. Already in the tree via cpal -> alsa -> alsa-sys.
alsa-sys = "0.3"
